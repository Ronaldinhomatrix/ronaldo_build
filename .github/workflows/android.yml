name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf automake libtool \
            pkg-config cmake patch libffi-dev libssl-dev libltdl-dev \
            libgmp-dev libsqlite3-dev zlib1g-dev libncurses5-dev \
            libncursesw5-dev libbz2-dev libreadline-dev libgdbm-dev \
            libexpat1-dev liblzma-dev uuid-dev libmpc-dev libmpfr-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavdevice-dev \
            libavfilter-dev libpostproc-dev libswresample-dev
          
          pip3 install --user --upgrade buildozer "cython<3.0"

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Aceita licenças e inicia o build
          yes | buildozer android debug
        env:
          BUILDOZER_ALLOW_ORG_NAME_START_WITH_DIGIT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ronaldo-medeiros-apk
          path: bin/*.apk
