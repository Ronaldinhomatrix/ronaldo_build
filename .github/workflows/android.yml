name: Build APK Assinado (Oficial)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool pkg-config cmake patch libffi-dev libssl-dev libsqlite3-dev
          pip3 install --user --upgrade buildozer "cython<3.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ronaldo.jks

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Buildozer release gera o APK que aceita assinatura externa
          buildozer android release
        env:
          BUILDOZER_ALLOW_ORG_NAME_START_WITH_DIGIT: 1

      - name: Sign APK
        run: |
          # Localiza apksigner e o APK gerado
          APK_PATH=$(find bin/ -name "*-release-unsigned.apk" | head -n 1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
          
          # Assina usando a keystore decodificada
          # O comando abaixo assume o caminho do SDK padrão do buildozer no GitHub
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign \
            --ks ronaldo.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out bin/RonaldoMedeirosFisiologista_Oficial.apk \
            "$APK_PATH"

      - name: Upload APK Oficial
        uses: actions/upload-artifact@v4
        with:
          name: ronaldo-medeiros-apk-oficial
          path: bin/RonaldoMedeirosFisiologista_Oficial.apk
