name: Build APK Assinado (Oficial)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool pkg-config cmake patch libffi-dev libssl-dev libsqlite3-dev
          pip3 install --user --upgrade buildozer "cython<3.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ronaldo.jks

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Buildozer release gera o APK
          buildozer android release
        env:
          BUILDOZER_ALLOW_ORG_NAME_START_WITH_DIGIT: 1

      - name: Sign and Align APK
        run: |
          # 1. Localiza as ferramentas do Android SDK
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -1)
          ZIPALIGN=$(find /usr/local/lib/android/sdk/build-tools -name "zipalign" | sort -V | tail -1)
          
          # 2. Localiza o APK gerado (unsigned)
          UNSIGNED_APK=$(find bin/ -name "*-release-unsigned.apk" | head -n 1)
          [ -z "$UNSIGNED_APK" ] && UNSIGNED_APK=$(find bin/ -name "*.apk" | head -n 1)
          
          echo "Usando apksigner: $APKSIGNER"
          echo "Usando zipalign: $ZIPALIGN"
          echo "APK original: $UNSIGNED_APK"

          # 3. Alinhamento (Obrigatório para o Google)
          $ZIPALIGN -v -f 4 "$UNSIGNED_APK" bin/aligned.apk

          # 4. Assinatura Oficial
          $APKSIGNER sign \
            --ks ronaldo.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out bin/RonaldoMedeirosFisiologista_Oficial.apk \
            bin/aligned.apk

      - name: Upload APK Oficial
        uses: actions/upload-artifact@v4
        with:
          name: ronaldo-medeiros-apk-oficial
          path: bin/RonaldoMedeirosFisiologista_Oficial.apk
