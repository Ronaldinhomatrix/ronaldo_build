name: Build APK Assinado (Oficial)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool pkg-config cmake patch libffi-dev libssl-dev libsqlite3-dev
          pip3 install --user --upgrade buildozer "cython<3.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ronaldo.jks

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # yes | aceita todas as licenças do SDK automaticamente
          yes | buildozer android release
        env:
          BUILDOZER_ALLOW_ORG_NAME_START_WITH_DIGIT: 1

      - name: Sign and Align APK
        run: |
          # Localiza as ferramentas do Android SDK instaladas pelo Buildozer
          BUILD_TOOLS_DIR=$(find $HOME/.buildozer/android/platform/android-sdk/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          
          # Localiza o APK gerado
          UNSIGNED_APK=$(find bin/ -name "*-release-unsigned.apk" | head -n 1)
          [ -z "$UNSIGNED_APK" ] && UNSIGNED_APK=$(find bin/ -name "*.apk" | head -n 1)
          
          echo "Ferramentas: $BUILD_TOOLS_DIR"
          echo "APK: $UNSIGNED_APK"

          # Alinhamento e Assinatura
          $ZIPALIGN -f 4 "$UNSIGNED_APK" bin/aligned.apk
          $APKSIGNER sign \
            --ks ronaldo.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out bin/RonaldoMedeirosFisiologista_Oficial.apk \
            bin/aligned.apk

      - name: Upload APK Oficial
        uses: actions/upload-artifact@v4
        with:
          name: ronaldo-medeiros-apk-oficial
          path: bin/RonaldoMedeirosFisiologista_Oficial.apk
