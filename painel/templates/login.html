{% extends "base.html" %}
{% block title %}Login — Painel Treinador{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-header text-center fw-bold">Painel do Treinador</div>
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control bg-dark text-light border-secondary"
                   autofocus required>
          </div>
          {% if erro %}
            <p class="text-danger small">{{ erro }}</p>
          {% endif %}
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
