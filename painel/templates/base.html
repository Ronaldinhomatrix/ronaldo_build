<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel Treinador{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #121212; color: #e0e0e0; }
    .card { background: #1e1e1e; border: 1px solid #333; }
    .card-header { background: #2a2a2a; border-bottom: 1px solid #333; color: #e0e0e0; }
    .table { color: #e0e0e0; }
    .table th, .table td { color: #e0e0e0; border-color: #444; }
    .table-dark { --bs-table-bg: #1e1e1e; --bs-table-color: #e0e0e0; --bs-table-border-color: #444; }
    .table-dark th, .table-dark td { color: #e0e0e0; }
    .navbar { background: #1a1a2e !important; }
    .badge-trainer { background: #ffc107; color: #000; }
    .form-label { color: #aaa; }
    .table td, .table th, .table thead tr, .table tbody tr td { color: #e0e0e0 !important; }
    .card, .card-body, .card-header, .card p, .card li, .card ol, .card label { color: #e0e0e0; }
    .text-secondary { color: #aaa !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">Ronaldo Medeiros <span style="color:#5b9cf6">Fisiologista</span></a>
      <div class="d-flex gap-3 align-items-center">
        <a href="/exercicios" class="text-light small text-decoration-none">Exercícios</a>
        <a href="/banco-treinos" class="text-light small text-decoration-none">Banco de Treinos</a>
        <a href="/logout" class="text-muted small text-decoration-none">Sair</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
